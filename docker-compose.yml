# Delilah Financial OS — Docker Compose
#
# Required services:
#   delilah           — Discord bot + advisor loop + financial monitor
#   ollama            — LLM backend (GPU optional)
#   searxng          — web search engine
#   stirling-pdf     — PDF manipulation & form processing
#   sandbox          — isolated Python/shell execution
#   sandbox-installer — one-shot pip installs for the sandbox
#   pypi-proxy       — Squid cache for sandbox pip installs
#
# Quick start:
#   1. cp .env.example .env  and fill in your values
#   2. docker compose up -d --build
#   3. docker logs delilah_bot -f
#
# All services run on an internal bridge network. Only delilah (port 8000),
# searxng (8080), stirling-pdf (8085), and ollama (11434) are exposed to the host.

name: financebot

networks:
  financebot-internal:
    driver: bridge
    internal: true
  sandbox-egress:
    driver: bridge
    internal: true
  # Public internet is opt-in for the isolated execution sandbox. Keep this
  # separate from the shared egress network so sandbox code can reach public
  # HTTPS endpoints without gaining peer access to OmniRoute/browser services.
  sandbox-internet:
    driver: bridge
  egress:
    driver: bridge

volumes:
  ollama_data:
  sandbox-packages:
  sandbox-workspace:
  qdrant_data:
  omniroute-data:
  kev_model_cache:

services:
  # ============================================================
  # Main bot — Discord interface, advisor loop, financial monitor
  # ============================================================
  delilah:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delilah_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OLLAMA_URL=http://ollama:11434/api/chat
      - SEARXNG_URL=http://searxng:8080/search
      - OMNIROUTE_SEARCH_ENABLED=${OMNIROUTE_SEARCH_ENABLED:-1}
      - OMNIROUTE_SEARCH_URL=http://omniroute:20128/v1/search
      - OMNIROUTE_SEARCH_PROVIDER=${OMNIROUTE_SEARCH_PROVIDER:-duckduckgo-free}
      - SANDBOX_URL=http://sandbox:8100/execute
      - SANDBOX_SHELL_URL=http://sandbox:8100/shell
      - SANDBOX_INSTALL_URL=http://sandbox-installer:8100/install
      - SANDBOX_WORKSPACE_READ_URL=http://sandbox:8100/workspace/read
      - STIRLING_PDF_URL=http://stirling-pdf:8080
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_EMBED_URL=http://ollama:11434/api/embed
      - BROWSERLESS_URL=http://browserless:3000
      - OPENROUTER_FREE_MODELS=poolside/laguna-s-2.1:free,qwen/qwen3.8-27b:free,nvidia/nemotron-3-super-120b-a12b:free
      - OPENROUTER_FREE_VISION_MODELS=nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
      - OPENROUTER_PAID_MODEL=${OPENROUTER_PAID_MODEL:-qwen/qwen3.8-27b:free}
      # Do not inherit a host-side 127.0.0.1 setting into the container.
      # Override explicitly with KEV_DOCKER_LOCAL_URL when needed.
      - KEV_LOCAL_URL=${KEV_DOCKER_LOCAL_URL:-http://kev:8009/v1/systemone}
      - DELILAH_ROUTE_PROFILES=${DELILAH_ROUTE_PROFILES:-primary=openrouter|qwen/qwen3.8-27b:free}
      - DELILAH_ROUTE_PROFILE=${DELILAH_ROUTE_PROFILE:-primary}
      - DELILAH_INLINE_MEMORY=${DELILAH_INLINE_MEMORY:-0}
      - DELILAH_BACKGROUND_MEMORY=${DELILAH_BACKGROUND_MEMORY:-0}
      - ADVISOR_LIVE_PREVIEW=${ADVISOR_LIVE_PREVIEW:-0}
      - TOOL_ROUTER_SHADOW=${TOOL_ROUTER_SHADOW:-0}
      - TOOL_ROUTER_SHADOW_SAMPLE=${TOOL_ROUTER_SHADOW_SAMPLE:-1}
      - TOOL_ROUTER_LIVE=${TOOL_ROUTER_LIVE:-0}
      - TOOL_ROUTER_LIVE_MIN_SCORE=${TOOL_ROUTER_LIVE_MIN_SCORE:-0}
      - MCP_WEB_BROWSER_URL=http://mcp-web-browser:3000/sse
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - sandbox-workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - financebot-internal
      - egress
    ports:
      - "8000:8000"
    depends_on:
      - ollama
      - searxng
      - sandbox
      - stirling-pdf
      - qdrant
      - browserless
      - mcp-web-browser
      - omniroute
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ============================================================
  # Optional Kev typed-decision sidecar
  # ============================================================
  kev:
    profiles: ["kev"]
    build:
      context: ./kev
      dockerfile: Dockerfile
      args:
        KEV_REF: ${KEV_REF:-90990a5fac2995b9faa3190f7d437e84f2067768}
    container_name: financebot-kev
    restart: unless-stopped
    environment:
      KEV_RUN: ${KEV_RUN:-jaredpalmer/kev-4b}
      # This host's 8 GiB GPU cannot hold Kev-4B; override with cuda on a
      # machine with sufficient VRAM.
      KEV_DEVICE: ${KEV_DEVICE:-cpu}
    networks:
      - financebot-internal
      - egress
    expose:
      - "8009"
    # Allows a host-run Delilah process to use KEV_LOCAL_URL=127.0.0.1:8009.
    # The API has no authentication, so keep this bound to loopback.
    ports:
      - "127.0.0.1:8009:8009"
    volumes:
      - kev_model_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8009/v1/models', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ============================================================
  # Ollama — LLM backend
  # ============================================================
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_CONTEXT_LENGTH=32768
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q4_0
      - OLLAMA_NUM_THREAD=16
    networks:
      - financebot-internal
      - egress
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ============================================================
  # SearXNG — web search engine
  # ============================================================
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    networks:
      - financebot-internal
      - egress
    ports:
      - "8080:8080"

  # ============================================================
  # Stirling PDF — PDF manipulation & form processing
  # ============================================================
  stirling-pdf:
    image: frooodle/s-pdf:latest
    container_name: financebot-stirling-pdf
    restart: unless-stopped
    networks:
      - financebot-internal
    ports:
      - "8085:8080"
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - SECURITY_ENABLELOGIN=false
      - INSTALL_BOOK_AND_ADVANCED_HTML_OPS=false
      - SYSTEM_DEFAULTLOCALE=en-US
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/info/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # Qdrant — vector database for hybrid GraphRAG & dense semantic search
  # ============================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: financebot-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - financebot-internal
    ports:
      - "6333:6333"
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__TELEMETRY_DISABLED=true

  # ============================================================
  # OmniRoute — local LLM gateway (free-tier-first routing + fallback)
  # ============================================================
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: financebot-omniroute
    restart: unless-stopped
    environment:
      - PORT=20128
      - HOST=0.0.0.0
      - OMNIROUTE_PORT=20128
      - OMNIROUTE_DATA_DIR=/app/data
      - OMNIROUTE_ALLOW_DEFAULT_DATA_DIR=1
      - INITIAL_PASSWORD=${OMNIROUTE_INITIAL_PASSWORD}
      - JWT_SECRET=${OMNIROUTE_JWT_SECRET}
      - API_KEY_SECRET=${OMNIROUTE_API_KEY_SECRET}
      - STORAGE_ENCRYPTION_KEY=${OMNIROUTE_STORAGE_ENCRYPTION_KEY}
      - OMNIROUTE_MEMORY_MB=${OMNIROUTE_MEMORY_MB:-2048}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - JINA_API_KEY=${JINA_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
    volumes:
      - omniroute-data:/app/data
    networks:
      - financebot-internal
      - egress
    ports:
      - "20128:20128"

  # ============================================================
  # Browserless — headless Chromium sidecar for deep JS web scraping
  # ============================================================
  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: financebot-browserless
    restart: unless-stopped
    networks:
      - financebot-internal
      - egress
    ports:
      - "3002:3000"
    environment:
      - CONCURRENT=5
      - QUEUED=10
      # This Browserless image treats TIMEOUT=-1 as a zero-millisecond
      # timeout, which immediately returns 408. Use a long explicit window;
      # the bot still closes sessions on cancel/mission cleanup.
      - TIMEOUT=3600000
      - PREBOOT_CHROME=true
      - KEEP_ALIVE=true

  # ============================================================
  # MCP Web Browser — Model Context Protocol sidecar for browser tools
  # ============================================================
  mcp-web-browser:
    build:
      context: ./mcp-servers/web-browser
      dockerfile: Dockerfile
    container_name: financebot-mcp-web-browser
    restart: unless-stopped
    environment:
      - BROWSERLESS_URL=http://browserless:3000
      - PORT=3000
    networks:
      - financebot-internal
      - egress
    depends_on:
      - browserless

  # ============================================================
  # Sandbox — isolated Python/shell execution
  # ============================================================
  sandbox:
    build:
      context: .
      dockerfile: ./sandbox/Dockerfile
    container_name: financebot-sandbox
    restart: unless-stopped
    environment:
      - SANDBOX_DEFAULT_TIMEOUT=90
      - SANDBOX_MAX_TIMEOUT=14400
      - SANDBOX_INTERNAL_TOKEN=${SANDBOX_INTERNAL_TOKEN}
      - SANDBOX_MEMORY_LIMIT_MB=1536
      - SANDBOX_PACKAGES_DIR=/opt/packages
      - SANDBOX_HOST_PROJECT_DIR=/host/project
      - SANDBOX_HOST_DB_PATH=/host/data/finances.db
      # Bulk scripts cannot invoke Delilah-native tools; they use these
      # internal HTTP search services directly from the internet-enabled
      # sandbox network.
      - OMNIROUTE_SEARCH_URL=http://omniroute:20128/v1/search
      - OMNIROUTE_SEARCH_PROVIDER=${OMNIROUTE_SEARCH_PROVIDER:-duckduckgo-free}
      - SEARXNG_URL=http://searxng:8080/search
    volumes:
      - sandbox-packages:/opt/packages:ro
      - sandbox-workspace:/workspace
    networks:
      - financebot-internal
      - sandbox-internet
    mem_limit: 3072m
    cpus: 8.0
    pids_limit: 1024
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ============================================================
  # Sandbox installer — one-shot pip installs for the sandbox
  # ============================================================
  sandbox-installer:
    build:
      context: .
      dockerfile: ./sandbox/Dockerfile
    container_name: financebot-sandbox-installer
    restart: unless-stopped
    environment:
      - SANDBOX_PACKAGES_DIR=/opt/packages
      - SANDBOX_INSTALL_TIMEOUT=120
      - SANDBOX_INSTALL_TIMEOUT_MAX=300
      - SANDBOX_INTERNAL_TOKEN=${SANDBOX_INTERNAL_TOKEN}
    volumes:
      - sandbox-packages:/opt/packages
    networks:
      - sandbox-egress
    mem_limit: 1024m
    cpus: 2.0
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ============================================================
  # PyPI proxy — Squid cache for sandbox pip installs
  # ============================================================
  pypi-proxy:
    image: ubuntu/squid:latest
    container_name: financebot-pypi-proxy
    restart: unless-stopped
    networks:
      - sandbox-egress
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
