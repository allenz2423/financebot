# Delilah Financial OS — Docker Compose
#
# Required services:
#   delilah           — Discord bot + advisor loop + financial monitor
#   ollama            — LLM backend (GPU optional)
#   searxng          — web search engine
#   sandbox          — isolated Python/shell execution
#   sandbox-installer — one-shot pip installs for the sandbox
#   pypi-proxy       — Squid cache for sandbox pip installs
#
# Quick start:
#   1. cp .env.example .env  and fill in your values
#   2. docker compose up -d --build
#   3. docker logs delilah_bot -f
#
# All services run on an internal bridge network. Only delilah (port 8000),
# searxng (8080), and ollama (11434) are exposed to the host.

name: financebot

networks:
  financebot-internal:
    driver: bridge
    internal: true
  sandbox-egress:
    driver: bridge
    internal: true
  egress:
    driver: bridge

volumes:
  ollama_data:
  sandbox-packages:
  sandbox-workspace:

services:
  # ============================================================
  # Main bot — Discord interface, advisor loop, financial monitor
  # ============================================================
  delilah:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delilah_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OLLAMA_URL=http://ollama:11434/api/chat
      - SEARXNG_URL=http://searxng:8080/search
      - SANDBOX_URL=http://sandbox:8100/execute
      - SANDBOX_SHELL_URL=http://sandbox:8100/shell
      - SANDBOX_INSTALL_URL=http://sandbox-installer:8100/install
      - SANDBOX_WORKSPACE_READ_URL=http://sandbox:8100/workspace/read
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    networks:
      - financebot-internal
      - egress
    ports:
      - "8000:8000"
    depends_on:
      - ollama
      - searxng
      - sandbox
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ============================================================
  # Ollama — LLM backend
  # ============================================================
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_CONTEXT_LENGTH=32768
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q4_0
      - OLLAMA_NUM_THREAD=16
    networks:
      - financebot-internal
      - egress
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ============================================================
  # SearXNG — web search engine
  # ============================================================
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    networks:
      - financebot-internal
      - egress
    ports:
      - "8080:8080"

  # ============================================================
  # Sandbox — isolated Python/shell execution
  # ============================================================
  sandbox:
    build:
      context: .
      dockerfile: ./sandbox/Dockerfile
    container_name: financebot-sandbox
    restart: unless-stopped
    environment:
      - SANDBOX_DEFAULT_TIMEOUT=90
      - SANDBOX_MAX_TIMEOUT=300
      - SANDBOX_INTERNAL_TOKEN=${SANDBOX_INTERNAL_TOKEN}
      - SANDBOX_MEMORY_LIMIT_MB=1536
      - SANDBOX_PACKAGES_DIR=/opt/packages
      - SANDBOX_HOST_PROJECT_DIR=/host/project
      - SANDBOX_HOST_DB_PATH=/host/data/finances.db
    volumes:
      - sandbox-packages:/opt/packages:ro
      - sandbox-workspace:/workspace
    networks:
      - financebot-internal
    mem_limit: 3072m
    cpus: 8.0
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ============================================================
  # Sandbox installer — one-shot pip installs for the sandbox
  # ============================================================
  sandbox-installer:
    build:
      context: .
      dockerfile: ./sandbox/Dockerfile
    container_name: financebot-sandbox-installer
    restart: unless-stopped
    environment:
      - SANDBOX_PACKAGES_DIR=/opt/packages
      - SANDBOX_INSTALL_TIMEOUT=120
      - SANDBOX_INSTALL_TIMEOUT_MAX=300
      - SANDBOX_INTERNAL_TOKEN=${SANDBOX_INTERNAL_TOKEN}
    volumes:
      - sandbox-packages:/opt/packages
    networks:
      - sandbox-egress
    mem_limit: 1024m
    cpus: 2.0
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ============================================================
  # PyPI proxy — Squid cache for sandbox pip installs
  # ============================================================
  pypi-proxy:
    image: ubuntu/squid:latest
    container_name: financebot-pypi-proxy
    restart: unless-stopped
    networks:
      - sandbox-egress
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
