# PyPI-only egress proxy for financebot sandbox package installation.
# The installer container has no direct Internet network; it can only reach
# this proxy on sandbox-egress.

http_port 3128

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Only allow the package indexes / file hosts needed by normal PyPI installs.
acl pypi_domains dstdomain .pypi.org .pythonhosted.org files.pythonhosted.org pypi.python.org

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow pypi_domains
http_access deny all

cache deny all
access_log stdio:/var/log/squid/access.log

